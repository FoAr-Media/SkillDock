name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "What problem would this solve?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: "Proposed behaviour" }
    validations: { required: true }
  - type: textarea
    id: docs
    attributes: { label: "Which official Claude documentation describes the behaviour you want to manage?" }
